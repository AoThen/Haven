name: Build Haven (signed)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-haven-signed.yml

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
      actions: write

    steps:
      - name: Delete workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 7
          keep_minimum_runs: 1

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Decode or generate release keystore
        id: keystore
        run: |
          if [ -n "${{ secrets.SIGNING_KEY_BASE64 }}" ]; then
            echo "${{ secrets.SIGNING_KEY_BASE64 }}" | base64 -d > haven-release.jks
            echo "Keystore decoded from secrets (stable signature)"
            echo "generated=false" >> "$GITHUB_OUTPUT"
          else
            echo "SIGNING_KEY_BASE64 not set - generating a fresh keystore"
            echo "Download the generated-keystore artifact, base64 it into secrets to keep a stable signature"
            keytool -genkeypair -v -keystore haven-release.jks \
              -alias haven -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass havenSelfSign -keypass havenSelfSign \
              -dname "CN=Haven Self-Build, OU=Self, O=AoThen, C=CN"
            echo "generated=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build signed APK (arm64 full release)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            export KEYSTORE_PASSWORD=havenSelfSign
            export KEY_ALIAS=haven
            export KEY_PASSWORD=havenSelfSign
          fi
          export KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD
          set -o pipefail
          ./gradlew :app:assembleArm64FullRelease \
            -PtargetAbi=arm64 \
            -PnoLintVital \
            -PskipWaylandNatives=true \
            -PskipFfmpegNatives=true \
            -Pkotlin.compiler.execution.strategy=in-process \
            -Dorg.gradle.jvmargs=-Xmx3g 2>&1 | tee build-log.txt

      - name: Upload build log (debug)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build-log.txt
          retention-days: 1

      - name: Upload build log to ci-debug release (debug)
        if: failure()
        run: |
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          AUTH="Authorization: Bearer ${GITHUB_TOKEN}"
          TAG=ci-debug
          REL_ID=$(curl -s -H "$AUTH" "$API/releases/tags/$TAG" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("id",""))')
          if [ -z "$REL_ID" ]; then
            REL_ID=$(curl -s -X POST -H "$AUTH" -H "Content-Type: application/json" \
              -d "{\"tag_name\":\"$TAG\",\"name\":\"CI debug logs\",\"prerelease\":true}" \
              "$API/releases" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("id",""))')
          fi
          echo "release id: $REL_ID"
          for AID in $(curl -s -H "$AUTH" "$API/releases/$REL_ID/assets" | python3 -c 'import json,sys; [print(a["id"]) for a in json.load(sys.stdin) if a["name"]=="build-log-tail.txt"]'); do
            curl -s -X DELETE -H "$AUTH" "$API/releases/assets/$AID"
          done
          tail -n 500 "${GITHUB_WORKSPACE}/build-log.txt" > /tmp/build-log-tail.txt
          curl -s -X POST -H "$AUTH" -H "Content-Type: application/octet-stream" \
            --data-binary @/tmp/build-log-tail.txt \
            "$API/releases/$REL_ID/assets?name=build-log-tail.txt"
          echo "done"

      - name: Upload generated keystore (first run only)
        if: steps.keystore.outputs.generated == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: generated-keystore
          path: haven-release.jks
          retention-days: 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Haven-arm64-full-release
          path: app/build/outputs/apk/**/release/*.apk
          retention-days: 7
